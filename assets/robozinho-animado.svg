<svg id="bot" viewBox="0 0 200 200" width="220" height="220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      :root{
        --bg-deep:#0a0e11;
        --bg-panel:#10151a;
        --bg-panel-2:#151b21;
        --line:#232b32;
        --text-muted:#8b98a3;
        --text-dim:#5b6771;
        --signal:#4fd1c5;
        --alert:#ffa94d;
      }

      #bot-tag{
        transform-origin: 100px 58px;
        animation: tagTilt 4s ease-in-out infinite;
      }
      @keyframes tagTilt{
        0%, 100% { transform: rotate(0deg); }
        25%      { transform: rotate(10deg); }
        75%      { transform: rotate(-10deg); }
      }

      #bot-pupil-l, #bot-pupil-r{
        animation: eyeScan 4s ease-in-out infinite;
      }
      @keyframes eyeScan{
        0%, 100% { transform: translate(0px, 0px); }
        20%      { transform: translate(-2.5px, 0px); }
        40%      { transform: translate(2.5px, 0px); }
        60%      { transform: translate(0px, 2px); }
        80%      { transform: translate(0px, -2px); }
      }

      #bot-cursor{
        animation: blinkCursor 1s step-end infinite;
      }
      @keyframes blinkCursor{
        0%, 49%  { opacity: 1; }
        50%,100% { opacity: 0; }
      }

      #bot-eyelid{
        animation: eyeBlink 4.5s ease-in-out infinite;
      }
      @keyframes eyeBlink{
        0%, 92%, 100% { transform: scaleY(0); }
        95%           { transform: scaleY(1); }
      }
    </style>
  </defs>

  <!-- floating code tag, gently tilting -->
  <g id="bot-tag">
    <rect x="76" y="24" width="48" height="24" rx="6" fill="var(--bg-panel-2)" stroke="var(--line)" stroke-width="1.5"/>
    <text x="100" y="41" text-anchor="middle" font-family="monospace" font-size="14" fill="var(--signal)">&lt;/&gt;</text>
  </g>

  <!-- connector -->
  <line x1="100" y1="48" x2="100" y2="58" stroke="var(--line)" stroke-width="2"/>

  <!-- terminal body -->
  <rect x="50" y="58" width="100" height="88" rx="10" fill="var(--bg-panel)" stroke="var(--line)" stroke-width="2"/>

  <!-- title bar -->
  <path d="M50 68a10 10 0 0 1 10-10h80a10 10 0 0 1 10 10v8H50v-8z" fill="var(--bg-panel-2)"/>
  <circle cx="62" cy="68" r="2.6" fill="var(--line)"/>
  <circle cx="70" cy="68" r="2.6" fill="var(--line)"/>
  <circle cx="78" cy="68" r="2.6" fill="var(--alert)"/>

  <!-- screen -->
  <rect x="58" y="84" width="84" height="52" fill="#050708" stroke="var(--line)"/>

  <!-- eyes (cursor blocks) -->
  <g id="bot-eyes">
    <rect id="bot-pupil-l" x="76" y="102" width="10" height="12" fill="var(--signal)"/>
    <rect id="bot-pupil-r" x="112" y="102" width="10" height="12" fill="var(--signal)"/>
    <!-- eyelid overlay for blink, drawn on top of the same coords as the eyes group -->
    <g id="bot-eyelid" transform-origin="76px 102px">
      <rect x="76" y="102" width="10" height="12" fill="#050708"/>
      <rect x="112" y="102" width="10" height="12" fill="#050708"/>
    </g>
  </g>

  <!-- blinking prompt cursor -->
  <text x="66" y="128" font-family="monospace" font-size="12" fill="var(--text-dim)">&gt;</text>
  <rect id="bot-cursor" x="76" y="119" width="9" height="13" fill="var(--text-muted)"/>

  <!-- feet -->
  <rect x="64" y="146" width="14" height="10" rx="3" fill="var(--bg-panel-2)" stroke="var(--line)"/>
  <rect x="122" y="146" width="14" height="10" rx="3" fill="var(--bg-panel-2)" stroke="var(--line)"/>
</svg>
